openapi: 3.0.3
info:
  title: Inventory Management System API
  description: API tài liệu hoàn chỉnh cho Hệ thống Quản lý Kho Hàng (Inventory Management System).
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Server (v1)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công
        data:
          type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Thông tin không hợp lệ
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    UserRole:
      type: string
      enum: [ADMIN, MANAGER, STAFF]

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    StockTransactionType:
      type: string
      enum: [IMPORT, EXPORT, TRANSFER, ADJUSTMENT]

security:
  - bearerAuth: []

paths:
  # ==========================================
  # AUTH MODULE
  # ==========================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Đăng ký tài khoản mới (Public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, fullName, email]
              properties:
                username:
                  type: string
                  example: admin123
                password:
                  type: string
                  example: Password123!
                fullName:
                  type: string
                  example: Nguyễn Văn A
                email:
                  type: string
                  example: admin@example.com
                phone:
                  type: string
                  example: "0912345678"
      responses:
        201:
          description: Đăng ký thành công
        400:
          description: Dữ liệu không hợp lệ hoặc Email/Username đã tồn tại

  /auth/login:
    post:
      tags:
        - Auth
      summary: Đăng nhập hệ thống
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: Admin123!
      responses:
        200:
          description: Đăng nhập thành công, trả về Access Token & Refresh Token
        401:
          description: Tài khoản hoặc mật khẩu không chính xác

  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Làm mới Access Token bằng Refresh Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Cấp Access Token mới thành công
        401:
          description: Refresh token hết hạn hoặc không hợp lệ

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Đăng xuất hệ thống
      responses:
        200:
          description: Đăng xuất thành công

  /auth/me:
    get:
      tags:
        - Auth
      summary: Lấy thông tin tài khoản hiện tại
      responses:
        200:
          description: Trả về thông tin chi tiết của User đang đăng nhập

  /auth/profile:
    put:
      tags:
        - Auth
      summary: Cập nhật thông tin cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
      responses:
        200:
          description: Cập nhật thông tin thành công

  /auth/change-password:
    put:
      tags:
        - Auth
      summary: Đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Đổi mật khẩu thành công

  # ==========================================
  # USERS & ROLES MODULE
  # ==========================================
  /users:
    get:
      tags:
        - Users
      summary: Lấy danh sách người dùng (Phân trang, Lọc, Tìm kiếm) - Admin
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/UserRole'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        200:
          description: Danh sách người dùng
    post:
      tags:
        - Users
      summary: Tạo người dùng mới - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, fullName, email, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                fullName:
                  type: string
                email:
                  type: string
                role:
                  $ref: '#/components/schemas/UserRole'
                phone:
                  type: string
      responses:
        201:
          description: Tạo thành công

  /users/{id}:
    get:
      tags:
        - Users
      summary: Xem chi tiết người dùng - Admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết người dùng
    put:
      tags:
        - Users
      summary: Cập nhật thông tin người dùng - Admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                role:
                  $ref: '#/components/schemas/UserRole'
      responses:
        200:
          description: Cập nhật thành công
    delete:
      tags:
        - Users
      summary: Xóa người dùng - Admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  /users/{id}/status:
    put:
      tags:
        - Users
      summary: Thay đổi trạng thái người dùng (ACTIVE/INACTIVE) - Admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/UserStatus'
      responses:
        200:
          description: Cập nhật trạng thái thành công

  /roles:
    get:
      tags:
        - Roles
      summary: Lấy danh sách các Vai trò trong hệ thống - Admin
      responses:
        200:
          description: Danh sách Vai trò (ADMIN, MANAGER, STAFF)

  # ==========================================
  # CATEGORIES MODULE
  # ==========================================
  /categories:
    get:
      tags:
        - Categories
      summary: Lấy danh sách danh mục sản phẩm
      responses:
        200:
          description: Danh sách danh mục
    post:
      tags:
        - Categories
      summary: Tạo danh mục mới (Admin, Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        201:
          description: Tạo danh mục thành công

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Xem chi tiết danh mục
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết danh mục
    put:
      tags:
        - Categories
      summary: Cập nhật danh mục (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Cập nhật danh mục thành công
    delete:
      tags:
        - Categories
      summary: Xóa danh mục (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa danh mục thành công

  # ==========================================
  # UNITS MODULE
  # ==========================================
  /units:
    get:
      tags:
        - Units
      summary: Lấy danh sách đơn vị tính
      responses:
        200:
          description: Danh sách đơn vị tính
    post:
      tags:
        - Units
      summary: Tạo đơn vị tính mới (Admin, Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        201:
          description: Tạo thành công

  /units/{id}:
    get:
      tags:
        - Units
      summary: Xem chi tiết đơn vị tính
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết đơn vị tính
    put:
      tags:
        - Units
      summary: Cập nhật đơn vị tính (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        200:
          description: Cập nhật thành công
    delete:
      tags:
        - Units
      summary: Xóa đơn vị tính (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  # ==========================================
  # SUPPLIERS MODULE
  # ==========================================
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: Lấy danh sách nhà cung cấp (Phân trang, Tìm kiếm)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
      responses:
        200:
          description: Danh sách nhà cung cấp
    post:
      tags:
        - Suppliers
      summary: Tạo nhà cung cấp mới (Admin, Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                contactName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        201:
          description: Tạo thành công

  /suppliers/{id}:
    get:
      tags:
        - Suppliers
      summary: Xem chi tiết nhà cung cấp
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết nhà cung cấp
    put:
      tags:
        - Suppliers
      summary: Cập nhật nhà cung cấp (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contactName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                address:
                  type: string
      responses:
        200:
          description: Cập nhật thành công
    delete:
      tags:
        - Suppliers
      summary: Xóa nhà cung cấp (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  # ==========================================
  # PRODUCTS MODULE
  # ==========================================
  /products:
    get:
      tags:
        - Products
      summary: Lấy danh sách sản phẩm (Phân trang, Lọc danh mục/nhà cung cấp, Tìm kiếm SKU/tên)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: supplierId
          schema:
            type: string
      responses:
        200:
          description: Danh sách sản phẩm
    post:
      tags:
        - Products
      summary: Tạo sản phẩm mới (Admin, Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, categoryId, unitId, costPrice, sellingPrice]
              properties:
                sku:
                  type: string
                name:
                  type: string
                description:
                  type: string
                categoryId:
                  type: string
                unitId:
                  type: string
                supplierId:
                  type: string
                costPrice:
                  type: number
                sellingPrice:
                  type: number
                minStockAlert:
                  type: integer
      responses:
        201:
          description: Tạo sản phẩm thành công

  /products/{id}:
    get:
      tags:
        - Products
      summary: Xem chi tiết sản phẩm
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết sản phẩm
    put:
      tags:
        - Products
      summary: Cập nhật sản phẩm (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                categoryId:
                  type: string
                unitId:
                  type: string
                supplierId:
                  type: string
                costPrice:
                  type: number
                sellingPrice:
                  type: number
                minStockAlert:
                  type: integer
      responses:
        200:
          description: Cập nhật thành công
    delete:
      tags:
        - Products
      summary: Xóa sản phẩm (Admin, Manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  /products/sku/{sku}:
    get:
      tags:
        - Products
      summary: Tra cứu thông tin sản phẩm bằng máy quét Mã vạch / QR Code (bằng SKU)
      parameters:
        - in: path
          name: sku
          required: true
          schema:
            type: string
            example: LAP-DELL-XPS13
      responses:
        200:
          description: Trả về thông tin chi tiết sản phẩm kèm chuỗi Base64 Data URL của Barcode và QR Code

  /products/{id}/barcode:
    get:
      tags:
        - Products
      summary: Sinh ảnh Mã vạch Barcode (Code128) & QR Code dùng để in tem nhãn sản phẩm
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Trả về chuỗi Base64 Data URL hình ảnh Barcode & QR Code sẵn sàng hiển thị và in ấn

  # ==========================================
  # WAREHOUSES MODULE
  # ==========================================
  /warehouses:
    get:
      tags:
        - Warehouses
      summary: Lấy danh sách kho hàng
      responses:
        200:
          description: Danh sách kho hàng
    post:
      tags:
        - Warehouses
      summary: Tạo kho mới (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, address]
              properties:
                code:
                  type: string
                name:
                  type: string
                address:
                  type: string
                managerName:
                  type: string
                phone:
                  type: string
      responses:
        201:
          description: Tạo thành công

  /warehouses/{id}:
    get:
      tags:
        - Warehouses
      summary: Xem chi tiết kho hàng
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết kho hàng
    put:
      tags:
        - Warehouses
      summary: Cập nhật kho hàng (Admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                managerName:
                  type: string
                phone:
                  type: string
      responses:
        200:
          description: Cập nhật thành công
    delete:
      tags:
        - Warehouses
      summary: Xóa kho hàng (Admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Xóa thành công

  # ==========================================
  # STOCK TRANSACTIONS MODULE
  # ==========================================
  /stock-transactions:
    get:
      tags:
        - Stock Transactions
      summary: Lấy danh sách lịch sử giao dịch kho (Nhập/Xuất/Chuyển/Điều chỉnh)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/StockTransactionType'
        - in: query
          name: warehouseId
          schema:
            type: string
      responses:
        200:
          description: Danh sách giao dịch kho

  /stock-transactions/{id}:
    get:
      tags:
        - Stock Transactions
      summary: Xem chi tiết đơn giao dịch kho
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chi tiết giao dịch

  /stock-transactions/import:
    post:
      tags:
        - Stock Transactions
      summary: Tạo phiếu Nhập kho (Import)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, items]
              properties:
                warehouseId:
                  type: string
                supplierId:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity, price]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                      price:
                        type: number
      responses:
        201:
          description: Tạo phiếu nhập thành công

  /stock-transactions/export:
    post:
      tags:
        - Stock Transactions
      summary: Tạo phiếu Xuất kho (Export)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, items]
              properties:
                warehouseId:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity, price]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                      price:
                        type: number
      responses:
        201:
          description: Tạo phiếu xuất thành công

  /stock-transactions/transfer:
    post:
      tags:
        - Stock Transactions
      summary: Tạo phiếu Chuyển kho (Transfer giữa 2 kho)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWarehouseId, toWarehouseId, items]
              properties:
                fromWarehouseId:
                  type: string
                toWarehouseId:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
      responses:
        201:
          description: Tạo phiếu chuyển kho thành công

  /stock-transactions/adjustment:
    post:
      tags:
        - Stock Transactions
      summary: Điều chỉnh kiểm kê tồn kho (Adjustment - Admin/Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, items]
              properties:
                warehouseId:
                  type: string
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, actualQuantity]
                    properties:
                      productId:
                        type: string
                      actualQuantity:
                        type: integer
      responses:
        201:
          description: Kiểm kê điều chỉnh thành công

  # ==========================================
  # INVENTORY MODULE
  # ==========================================
  /inventory:
    get:
      tags:
        - Inventory
      summary: Tra cứu tồn kho theo Kho hàng & Sản phẩm
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: warehouseId
          schema:
            type: string
